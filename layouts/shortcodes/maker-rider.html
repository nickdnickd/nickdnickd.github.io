<div class="maker-game" data-maker-game>
  <div class="maker-game__topline">
    <div>
      <span class="maker-game__eyebrow">FIELD EXERCISE 01</span>
      <h2 class="maker-game__title">Ride the Maker</h2>
    </div>
    <button class="maker-game__sound" type="button" data-sound aria-pressed="false" aria-label="Toggle sound">SOUND OFF</button>
  </div>

  <div class="maker-game__stage">
    <canvas data-canvas width="960" height="540" aria-label="Desert worm-riding game"></canvas>
    <div class="maker-game__intro" data-intro>
      <p class="maker-game__kicker">THE DEEP DESERT</p>
      <p>The thumper calls. Read the sand. Time your jump. Ride.</p>
      <button type="button" data-start>BEGIN THE TEST</button>
    </div>
    <div class="maker-game__message" data-message aria-live="polite"></div>
  </div>

  <div class="maker-game__hud">
    <div><span>PHASE</span><strong data-phase>TAKE POSITION</strong></div>
    <div><span>GUIDANCE</span><strong data-guidance>Find the maker's approach line.</strong></div>
    <div><span>SCORE</span><strong data-score>0000</strong></div>
  </div>

  <div class="maker-game__controls" aria-label="Game controls">
    <button type="button" data-left aria-label="Move or steer left"><span>◀</span> LEFT</button>
    <button class="maker-game__action" type="button" data-action>JUMP</button>
    <button type="button" data-right aria-label="Move or steer right">RIGHT <span>▶</span></button>
  </div>
  <p class="maker-game__hint">Keyboard: <kbd>←</kbd> <kbd>→</kbd> to move · <kbd>Space</kbd> to jump &nbsp;—&nbsp; Touch: use the controls</p>
</div>

<style>
.maker-game{--ink:#241711;--sand:#d89a51;--sun:#ffd88a;--spice:#e76532;--night:#15212b;margin:2rem calc(50% - 48vw);width:96vw;max-width:1100px;color:#f8e8c9;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:var(--night);border:1px solid #82563b;box-shadow:0 24px 80px #0008;overflow:hidden;touch-action:manipulation}
.maker-game *{box-sizing:border-box}.maker-game button{font:inherit}.maker-game__topline{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid #82563b;background:#101920}.maker-game__eyebrow{font-size:.7rem;letter-spacing:.18em;color:#d79b67}.maker-game__title{font-family:Georgia,serif;font-size:clamp(1.35rem,3vw,2.1rem);font-weight:400;line-height:1;margin:.25rem 0 0;color:#ffe6b0}.maker-game__sound{border:1px solid #9f7255;background:transparent;color:#dca97d;padding:8px 10px;cursor:pointer;font-size:.7rem;letter-spacing:.08em}.maker-game__stage{position:relative;aspect-ratio:16/9;background:#cb8b45}.maker-game canvas{display:block;width:100%;height:100%;cursor:crosshair}.maker-game__intro{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:2rem;background:linear-gradient(#1019239e,#101923d9);backdrop-filter:blur(2px)}.maker-game__intro[hidden]{display:none}.maker-game__intro p{max-width:35rem;margin:.35rem auto 1.4rem;font-family:Georgia,serif;font-size:clamp(1.05rem,2.4vw,1.4rem)}.maker-game__intro .maker-game__kicker{margin:0 auto .4rem;color:#ffbd69;font-family:inherit;font-size:.72rem;letter-spacing:.22em}.maker-game__intro button,.maker-game__action{border:1px solid #ffcb86;background:var(--spice);color:#fff6dd;padding:13px 20px;cursor:pointer;box-shadow:4px 4px 0 #5b2d1d;font-weight:700;letter-spacing:.05em}.maker-game__intro button:hover,.maker-game__action:hover{filter:brightness(1.1)}.maker-game__message{position:absolute;top:18px;left:50%;transform:translateX(-50%) translateY(-10px);width:max-content;max-width:85%;padding:9px 14px;background:#101923df;border:1px solid #efb978;color:#fff3d0;text-align:center;font-size:.75rem;letter-spacing:.03em;opacity:0;transition:.18s}.maker-game__message.is-visible{opacity:1;transform:translateX(-50%) translateY(0)}.maker-game__hud{display:grid;grid-template-columns:.8fr 2fr .6fr;border-top:1px solid #82563b;border-bottom:1px solid #82563b;background:#17232c}.maker-game__hud>div{min-width:0;padding:10px 14px;border-right:1px solid #82563b}.maker-game__hud>div:last-child{border:0}.maker-game__hud span{display:block;font-size:.58rem;letter-spacing:.15em;color:#af8060}.maker-game__hud strong{display:block;overflow:hidden;margin-top:4px;color:#ffe5b3;font-size:clamp(.67rem,1.8vw,.86rem);text-overflow:ellipsis;white-space:nowrap}.maker-game__controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;padding:12px;background:#101920}.maker-game__controls button{min-height:48px;border:1px solid #795a45;background:#26343d;color:#ffe6ba;cursor:pointer;font-weight:700;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}.maker-game__controls button:active{transform:translateY(2px)}.maker-game__controls .maker-game__action{background:var(--spice);border-color:#ffbf76}.maker-game__hint{margin:0;padding:0 12px 12px;text-align:center;background:#101920;color:#b99170;font-size:.67rem}.maker-game kbd{padding:1px 5px;border:1px solid #755b49;border-radius:2px;background:#26343d;color:#ffe6ba}@media(max-width:600px){.maker-game{margin:1.5rem calc(50% - 50vw + 4px);width:calc(100vw - 8px);max-width:none}.maker-game__topline{padding:10px 12px}.maker-game__hud{grid-template-columns:1fr 2fr}.maker-game__hud>div:last-child{display:none}.maker-game__controls{gap:6px;padding:8px}.maker-game__controls button{font-size:.7rem}.maker-game__hint{font-size:.58rem;padding-bottom:8px}.maker-game__message{top:8px;font-size:.65rem}.maker-game__stage{aspect-ratio:4/3}}
@media(prefers-reduced-motion:reduce){.maker-game__message{transition:none}}
</style>

<script>
(() => {
  const root = document.currentScript.previousElementSibling.previousElementSibling;
  if (!root || !root.matches('[data-maker-game]') || root.dataset.ready) return;
  root.dataset.ready = 'true';
  const canvas = root.querySelector('[data-canvas]');
  const ctx = canvas.getContext('2d');
  const intro = root.querySelector('[data-intro]');
  const phaseEl = root.querySelector('[data-phase]');
  const guidanceEl = root.querySelector('[data-guidance]');
  const scoreEl = root.querySelector('[data-score]');
  const messageEl = root.querySelector('[data-message]');
  const actionEl = root.querySelector('[data-action]');
  const leftEl = root.querySelector('[data-left]');
  const rightEl = root.querySelector('[data-right]');
  const soundEl = root.querySelector('[data-sound]');
  const W = canvas.width, H = canvas.height;
  let audio = null, sound = false, raf = 0, last = 0, messageTimer = 0;
  let held = {left:false,right:false};
  let game;

  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const hillY=x=>390-112*Math.exp(-Math.pow((x-480)/235,2));
  function reset(){const approach=Math.random()<.5?-1:1;game={phase:'position',time:0,score:0,approach,riderX:480,wormX:approach<0?-150:1110,wormDistance:1,jumpX:0,jumpY:0,jumpVX:0,jumpVY:0,mounted:false,rideX:480,tailX:480,rideSpeed:0,balance:100,dodges:0,patrolX:rnd(160,800),patrolY:-90,patrolFaction:Math.random()<.5?'HARKONNEN':'SARDAUKAR',patrolChecked:false,rideTime:30,ended:false};updateHud()}
  function beep(freq=160,dur=.08){if(!sound)return;audio ||= new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
  function say(text){messageEl.textContent=text;messageEl.classList.add('is-visible');clearTimeout(messageTimer);messageTimer=setTimeout(()=>messageEl.classList.remove('is-visible'),1800)}
  function updateHud(){const map={position:['CHOOSE THE RIDGE','Move to a launch point. Watch the approaching maw.','JUMP'],jump:['AIRBORNE','Clear the mouth and meet the armored back.','AIRBORNE'],ride:['EVADE PATROLS',`${game.patrolFaction} THOPTER — leave its attack lane.`,'HOLD FAST'],end:['COMPLETE','The desert remembers your passage.','RIDE AGAIN']};const m=map[game.phase];phaseEl.textContent=m[0];guidanceEl.textContent=m[1];actionEl.textContent=m[2];actionEl.disabled=game.phase==='jump'||game.phase==='ride';scoreEl.textContent=String(Math.round(game.score)).padStart(4,'0')}
  function act(){if(game.phase==='position'){game.phase='jump';game.jumpX=game.riderX;game.jumpY=hillY(game.riderX)-27;game.jumpVX=game.approach*135;game.jumpVY=-270;game.score+=50;say('COMMIT — CLEAR THE MAW!');beep(210,.1);updateHud()}else if(game.phase==='end'){reset();intro.hidden=true;last=performance.now();raf=requestAnimationFrame(loop)}}
  function end(win,reason='THE DESERT WINS THIS ROUND.'){game.phase='end';game.ended=true;if(win){game.score+=Math.round(game.balance*3);say('RIDE COMPLETE — THE MAKER CARRIES YOU HOME.');beep(360,.3)}else{say(reason);beep(60,.3)}updateHud()}
  function wormStep(){game.wormDistance=Math.max(0,1-game.time/8);game.wormX=game.approach<0?-150+760*(1-game.wormDistance):1110-760*(1-game.wormDistance)}
  function mount(){game.phase='ride';game.mounted=true;game.time=0;game.rideX=480;game.tailX=480;game.score+=350;say('HOOKS SET — CAMERA ABOVE, PATROLS INBOUND!');beep(280,.18);updateHud()}
  function update(dt){if(!game||game.ended)return;game.time+=dt;const dir=(held.right?1:0)-(held.left?1:0);if(game.phase==='position'){game.riderX=clamp(game.riderX+dir*dt*245,105,855);wormStep();if(game.wormDistance<=.03)end(false,'TOO LATE — THE MAW TOOK THE RIDGE.')}else if(game.phase==='jump'){wormStep();game.jumpVX+=dir*32*dt;game.jumpX+=game.jumpVX*dt;game.jumpVY+=430*dt;game.jumpY+=game.jumpVY*dt;const mouthDist=Math.abs(game.jumpX-game.wormX),backX=game.wormX+game.approach*132,backDist=Math.abs(game.jumpX-backX);if(mouthDist<74&&game.jumpY>315)end(false,'THE JUMP FELL INTO THE MAW.');else if(game.jumpVY>0&&backDist<92&&game.jumpY>325)mount();else if(game.jumpY>470||game.wormDistance<=0)end(false,'MISSED THE BACK — LOST TO THE SAND.')}else if(game.phase==='ride'){game.rideTime-=dt;game.rideSpeed+=(dir*360-game.rideSpeed*2.6)*dt;game.rideX=clamp(game.rideX+game.rideSpeed*dt,90,870);game.tailX+=(game.rideX-game.tailX)*dt*1.35;game.balance-=Math.max(0,Math.abs(game.rideSpeed)-105)*dt*.09;game.balance=Math.min(100,game.balance+dt*1.1);game.patrolY+=dt*(150+game.dodges*8);if(game.patrolY>315&&!game.patrolChecked){game.patrolChecked=true;if(Math.abs(game.rideX-game.patrolX)<120){game.balance-=38;game.score=Math.max(0,game.score-75);say(`${game.patrolFaction} STRIKE — HOOKS SLIPPING!`);beep(55,.22)}else{game.dodges++;game.score+=175;say('ATTACK LANE CLEARED  +175');beep(330,.08)}}if(game.patrolY>560){game.patrolY=-100;game.patrolX=rnd(150,810);game.patrolFaction=Math.random()<.5?'HARKONNEN':'SARDAUKAR';game.patrolChecked=false;updateHud()}if(game.balance<=0)end(false,'PATROL FIRE BROKE YOUR GRIP.');else if(game.rideTime<=0)end(true);updateHud()}}
  function dune(y,amp,color,offset){ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=18)ctx.lineTo(x,y+Math.sin(x*.009+offset)*amp+Math.sin(x*.021-offset)*amp*.28);ctx.lineTo(W,H);ctx.fillStyle=color;ctx.fill()}
  function draw(){ctx.clearRect(0,0,W,H);if(!game||game.phase==='position'||game.phase==='jump')drawRidgeScene();else drawMapScene()}
  function drawRidgeScene(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#263947');sky.addColorStop(.48,'#cb7044');sky.addColorStop(1,'#efb560');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd789';ctx.beginPath();ctx.arc(790,87,42,0,7);ctx.fill();dune(280,35,'#b66b42',1.8);dune(350,48,'#ce8348',.3);ctx.fillStyle='#e6a75a';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=12)ctx.lineTo(x,hillY(x));ctx.lineTo(W,H);ctx.fill();ctx.strokeStyle='#aa6a42';ctx.lineWidth=2;for(let k=0;k<5;k++){ctx.beginPath();for(let x=60;x<900;x+=12)ctx.lineTo(x,hillY(x)+34+k*24);ctx.stroke()}ctx.fillStyle='#2b2420';ctx.fillRect(475,354,10,65);ctx.fillStyle='#efb25c';ctx.beginPath();ctx.arc(480,350,10+Math.sin(game.time*11)*3,0,7);ctx.fill();for(let r=24;r<92;r+=22){ctx.strokeStyle=`rgba(70,40,28,${1-r/110})`;ctx.beginPath();ctx.ellipse(480,415,r,10,0,0,7);ctx.stroke()}const close=1-game.wormDistance,s=.3+close*.95,wx=game.wormX;ctx.fillStyle='#985b3d88';for(let i=0;i<18;i++){ctx.beginPath();ctx.arc(wx+game.approach*rnd(0,145),402+rnd(-50,38),rnd(4,17)*s,0,7);ctx.fill()}ctx.strokeStyle='#49302a';ctx.lineWidth=112*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(wx+game.approach*190*s,435);ctx.lineTo(wx+game.approach*48*s,407);ctx.stroke();ctx.lineCap='butt';drawMaw(wx,400,s);if(game.phase==='jump'){ctx.setLineDash([7,8]);ctx.strokeStyle='#ffe2a888';ctx.beginPath();ctx.arc(game.jumpX,game.jumpY,28,Math.PI,Math.PI*2);ctx.stroke();ctx.setLineDash([]);drawRider(game.jumpX,game.jumpY)}else drawRider(game.riderX,hillY(game.riderX)-2);ctx.fillStyle='#17232ccc';ctx.fillRect(350,18,260,13);ctx.fillStyle=close>.5&&close<.9?'#70c37b':'#e76532';ctx.fillRect(354,22,252*close,5);ctx.strokeStyle='#fff4c8';ctx.strokeRect(350,18,260,13)}
  function drawMapScene(){ctx.fillStyle='#d99a50';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#b8754388';ctx.lineWidth=2;for(let k=0;k<11;k++){ctx.beginPath();for(let x=0;x<=W;x+=16)ctx.lineTo(x,34+k*52+Math.sin(x*.012+k)*17+Math.sin(x*.027-k)*7);ctx.stroke()}ctx.fillStyle='#69483b';[[110,100,75,42],[820,150,105,55],[155,445,120,52],[785,455,80,40]].forEach(([x,y,rx,ry])=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,.2,0,7);ctx.fill();ctx.strokeStyle='#8f6549';for(let r=.55;r<1;r+=.2){ctx.beginPath();ctx.ellipse(x,y,rx*r,ry*r,.2,0,7);ctx.stroke()}});ctx.fillStyle='#17232cdd';ctx.fillRect(25,20,188,39);ctx.fillStyle='#e2b376';ctx.font='14px monospace';ctx.fillText(`BALANCE ${Math.max(0,game.balance).toFixed(0)}%`,38,45);ctx.fillStyle='#17232cdd';ctx.fillRect(748,20,187,39);ctx.fillStyle='#e2b376';ctx.fillText(`${Math.max(0,game.rideTime).toFixed(1)} SEC`,785,45);ctx.strokeStyle='#e45e45aa';ctx.lineWidth=3;ctx.setLineDash([12,10]);ctx.beginPath();ctx.moveTo(game.patrolX,0);ctx.lineTo(game.patrolX,H);ctx.stroke();ctx.setLineDash([]);drawThopter(game.patrolX,game.patrolY,game.patrolFaction);const head=game.rideX,tail=game.tailX,mid=head*.68+tail*.32;ctx.fillStyle='#f0bd6950';ctx.beginPath();ctx.moveTo(head,62);ctx.lineTo(head-82,195);ctx.lineTo(head+82,195);ctx.closePath();ctx.fill();ctx.fillStyle='#372620';ctx.beginPath();ctx.moveTo(head-55,230);ctx.bezierCurveTo(mid-55,330,tail-55,455,tail-55,565);ctx.lineTo(tail+55,565);ctx.bezierCurveTo(tail+55,455,mid+55,330,head+55,230);ctx.quadraticCurveTo(head,165,head-55,230);ctx.fill();ctx.strokeStyle='#765244';ctx.lineWidth=4;for(let y=235;y<555;y+=25){const t=(y-230)/335,c=head*(1-t)+tail*t;ctx.beginPath();ctx.moveTo(c-49,y);ctx.quadraticCurveTo(c,y-12,c+49,y);ctx.stroke()}ctx.strokeStyle='#9c7053';ctx.lineWidth=4;for(let r=22;r<53;r+=13){ctx.beginPath();ctx.arc(head,225,r,Math.PI,0);ctx.stroke()}const riderX=head*.86+tail*.14;ctx.fillStyle='#171d20';ctx.beginPath();ctx.arc(riderX,270,9,0,7);ctx.fill();ctx.fillRect(riderX-4,278,8,25);ctx.strokeStyle='#d9a263';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(riderX-3,289);ctx.lineTo(riderX-34,317);ctx.moveTo(riderX+3,289);ctx.lineTo(riderX+34,317);ctx.stroke()}
  function drawMaw(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#31211e';ctx.beginPath();ctx.ellipse(0,0,72,94,0,0,7);ctx.fill();ctx.strokeStyle='#7b5646';ctx.lineWidth=14;ctx.stroke();ctx.strokeStyle='#b88462';ctx.lineWidth=4;for(let i=0;i<22;i++){const a=i/22*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(a)*37,Math.sin(a)*49);ctx.lineTo(Math.cos(a)*68,Math.sin(a)*90);ctx.stroke()}ctx.fillStyle='#d5b17a';for(let i=0;i<22;i++){const a=i/22*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(a)*40,Math.sin(a)*53);ctx.lineTo(Math.cos(a-.045)*57,Math.sin(a-.045)*76);ctx.lineTo(Math.cos(a+.045)*57,Math.sin(a+.045)*76);ctx.fill()}ctx.restore()}
  function drawThopter(x,y,faction){const s=clamp(.45+y/420,.45,1.5);ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=faction==='HARKONNEN'?'#241d1c':'#393735';ctx.strokeStyle='#171719';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-18,-16);ctx.lineTo(18,-16);ctx.lineTo(29,15);ctx.lineTo(0,28);ctx.lineTo(-29,15);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#74635a';ctx.fillRect(-78,-8,156,12);ctx.fillStyle='#171719';ctx.beginPath();ctx.moveTo(-20,-2);ctx.lineTo(-105,-28);ctx.lineTo(-80,7);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(20,-2);ctx.lineTo(105,-28);ctx.lineTo(80,7);ctx.closePath();ctx.fill();ctx.strokeStyle='#d7ad6e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-92,-26);ctx.lineTo(-68,4);ctx.moveTo(92,-26);ctx.lineTo(68,4);ctx.stroke();ctx.restore();if(y<125){ctx.fillStyle='#17232cdd';ctx.fillRect(x-72,y+42,144,24);ctx.fillStyle=faction==='HARKONNEN'?'#e56b4a':'#e3c17a';ctx.font='12px monospace';ctx.textAlign='center';ctx.fillText(`${faction} PATROL`,x,y+59);ctx.textAlign='left'}}
  function drawRider(x,y,riding=false){ctx.save();ctx.translate(x,y);if(riding)ctx.rotate(clamp(game.rideSpeed/600,-.2,.2));ctx.strokeStyle='#171d20';ctx.fillStyle='#171d20';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-23,8,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,13);ctx.moveTo(0,-3);ctx.lineTo(-15,5);ctx.moveTo(0,-3);ctx.lineTo(15,1);ctx.moveTo(0,13);ctx.lineTo(-10,27);ctx.moveTo(0,13);ctx.lineTo(10,27);ctx.stroke();if(riding){ctx.strokeStyle='#d9a263';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-15,5);ctx.lineTo(-33,28);ctx.moveTo(15,1);ctx.lineTo(35,25);ctx.stroke()}ctx.restore()}
  function loop(t){const dt=Math.min(.034,(t-last)/1000||0);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
  function setHeld(key,val){held[key]=val}
  [['pointerdown',true],['pointerup',false],['pointercancel',false],['pointerleave',false]].forEach(([ev,val])=>{leftEl.addEventListener(ev,e=>{e.preventDefault();setHeld('left',val)});rightEl.addEventListener(ev,e=>{e.preventDefault();setHeld('right',val)})});
  actionEl.addEventListener('click',act);root.querySelector('[data-start]').addEventListener('click',()=>{intro.hidden=true;reset();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)});soundEl.addEventListener('click',()=>{sound=!sound;soundEl.textContent=sound?'SOUND ON':'SOUND OFF';soundEl.setAttribute('aria-pressed',sound);beep(220,.08)});
  window.addEventListener('keydown',e=>{if(!root.isConnected)return;if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft')held.left=true;if(e.code==='ArrowRight')held.right=true;if(e.code==='Space'&&!e.repeat)act()});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')held.left=false;if(e.code==='ArrowRight')held.right=false});
  reset();draw();
})();
</script>
